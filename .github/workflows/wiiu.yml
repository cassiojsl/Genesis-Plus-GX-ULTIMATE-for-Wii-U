name: Genesis Plus GX ULTIMATE Wii U Build

# Builds genplus_wiiu.wuhb. Pushing a tag starting with "wiiu-" (for example
# wiiu-v1.0.0) also makes a GitHub release with it, whose text is
# .github/RELEASE_NOTES_WIIU.md.

on:
  push:
    tags: ['wiiu-*']
  workflow_dispatch:

jobs:
  build:
    name: Build Wii U
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Build Wii U
      shell: bash
      run: make -f Makefile.wiiu -j"$(nproc)"

    - uses: actions/upload-artifact@v4
      with:
        name: genplus_wiiu
        path: genplus_wiiu.wuhb

    - name: Release
      if: startsWith(github.ref, 'refs/tags/wiiu-')
      uses: softprops/action-gh-release@v2
      with:
        name: Genesis Plus GX ULTIMATE for Wii U ${{ github.ref_name }}
        body_path: .github/RELEASE_NOTES_WIIU.md
        files: genplus_wiiu.wuhb
