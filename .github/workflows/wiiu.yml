name: Genesis Plus GX ULTIMATE Wii U Build

# Builds genplus_wiiu.wuhb. A tag starting with "wiiu-" (for example
# wiiu-v1.0.0), pushed or given when running the workflow from the Actions
# tab, also makes a GitHub release with it, whose text is
# .github/RELEASE_NOTES_WIIU.md.

on:
  push:
    tags: ['wiiu-*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example wiiu-v1.0.0); empty to only build
        required: false

jobs:
  build:
    name: Build Wii U
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Build Wii U
      shell: bash
      run: make -f Makefile.wiiu -j"$(nproc)"

    - uses: actions/upload-artifact@v4
      with:
        name: genplus_wiiu
        path: genplus_wiiu.wuhb

    - name: Version
      id: ver
      shell: bash
      run: |
        TAG="${{ inputs.tag || github.ref_name }}"
        echo "version=${TAG#wiiu-}" >> "$GITHUB_OUTPUT"

    - name: Release
      if: startsWith(github.ref, 'refs/tags/wiiu-') || startsWith(inputs.tag, 'wiiu-')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.tag || github.ref_name }}
        target_commitish: ${{ github.sha }}
        name: Genesis Plus GX ULTIMATE for Wii U ${{ steps.ver.outputs.version }}
        make_latest: true
        body_path: .github/RELEASE_NOTES_WIIU.md
        files: genplus_wiiu.wuhb
